<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deriv Connection Test</title>
</head>

<body>

<h1>Deriv Connection Test</h1>

<h2 id="status">Connecting...</h2>

<p id="details"></p>

<script>

const status = document.getElementById("status");
const details = document.getElementById("details");

const ws = new WebSocket(
    "wss://ws.binaryws.com/websockets/v3?app_id=1089"
);

ws.onopen = function () {

    status.innerText = "CONNECTED ✅";

    details.innerText =
        "WebSocket opened successfully.";

    ws.send(JSON.stringify({
        ping: 1
    }));

};

ws.onmessage = function (event) {

    console.log(event.data);

    status.innerText = "CONNECTED + RECEIVING DATA ✅";

    details.innerText =
        "Deriv responded successfully.";

};

ws.onerror = function () {

    status.innerText = "CONNECTION ERROR ❌";

};

ws.onclose = function (event) {

    status.innerText =
        "CONNECTION CLOSED ❌";

    details.innerText =
        "Close code: " + event.code;

};

</script>

</body>
</html>
