<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Deriv Connection Test</title>

<style>
body{
    background:#080c18;
    color:white;
    font-family:Arial,sans-serif;
    padding:20px;
}
.box{
    max-width:700px;
    margin:auto;
    background:#141b30;
    padding:20px;
    border-radius:15px;
}
button,select{
    width:100%;
    padding:14px;
    margin:8px 0;
    border:0;
    border-radius:8px;
    font-size:16px;
}
button{
    background:#ff3b7f;
    color:white;
    font-weight:bold;
}
.status{
    padding:15px;
    border-radius:8px;
    background:#222b45;
    margin:15px 0;
}
.tick{
    font-size:30px;
    font-weight:bold;
    text-align:center;
    margin:20px 0;
}
.log{
    background:#080c18;
    padding:12px;
    border-radius:8px;
    height:250px;
    overflow:auto;
    font-size:13px;
    line-height:1.6;
}
.good{
    color:#55e6a5;
}
.bad{
    color:#ff7f8a;
}
</style>
</head>

<body>

<div class="box">

<h1>🔌 Deriv Connection Test</h1>

<select id="symbol">
<option value="1HZ10V">Volatility 10 Index</option>
<option value="1HZ25V">Volatility 25 Index</option>
<option value="1HZ50V">Volatility 50 Index</option>
<option value="1HZ75V">Volatility 75 Index</option>
<option value="1HZ100V">Volatility 100 Index</option>
</select>

<button onclick="connectDeriv()">
CONNECT TO DERIV
</button>

<div id="status" class="status">
Status: NOT CONNECTED
</div>

<div class="tick">
Last tick: <span id="tick">—</span>
</div>

<div>
Ticks received:
<strong id="count">0</strong>
</div>

<h3>Connection Log</h3>

<div id="log" class="log"></div>

</div>


<script>

let ws = null;
let tickCount = 0;


/* ================================
   LOG
================================ */

function log(message){

    const box =
        document.getElementById("log");

    const time =
        new Date().toLocaleTimeString();

    box.innerHTML +=
        "[" + time + "] " +
        message +
        "<br>";

    box.scrollTop =
        box.scrollHeight;

}


/* ================================
   STATUS
================================ */

function status(message, good=false){

    const element =
        document.getElementById("status");

    element.innerText =
        "Status: " + message;

    element.className =
        good
        ? "status good"
        : "status";

}


/* ================================
   CONNECT
================================ */

function connectDeriv(){

    if(ws){

        try{
            ws.close();
        }catch(e){}

    }


    tickCount = 0;

    document.getElementById(
        "count"
    ).innerText = "0";

    document.getElementById(
        "tick"
    ).innerText = "—";

    document.getElementById(
        "log"
    ).innerHTML = "";


    const symbol =
        document.getElementById(
            "symbol"
        ).value;


    status(
        "CONNECTING..."
    );

    log(
        "Opening WebSocket..."
    );


    /*
       Deriv public market-data
       WebSocket.
    */

    ws =
        new WebSocket(
            "wss://ws.binaryws.com/websockets/v3"
        );


    /* ================================
       OPEN
    ================================ */

    ws.onopen =
    function(){

        status(
            "CONNECTED",
            true
        );

        log(
            "WebSocket connection established."
        );


        /*
           First request historical ticks.
        */

        status(
            "LOADING HISTORY...",
            true
        );


        log(
            "Requesting 250 historical ticks..."
        );


        ws.send(
            JSON.stringify({

                ticks_history:
                    symbol,

                end:
                    "latest",

                count:
                    250,

                style:
                    "ticks",

                subscribe:
                    0,

                req_id:
                    1

            })
        );

    };


    /* ================================
       MESSAGE
    ================================ */

    ws.onmessage =
    function(event){

        let data;


        try{

            data =
                JSON.parse(
                    event.data
                );

        }catch(error){

            log(
                "Could not read server response."
            );

            return;

        }


        /*
           API ERROR
        */

        if(data.error){

            status(
                "API ERROR"
            );

            log(
                "ERROR: " +
                data.error.message
            );

            return;

        }


        /*
           HISTORY RECEIVED
        */

        if(
            data.msg_type ===
            "history"
        ){

            const prices =
                data.history &&
                data.history.prices
                ?
                data.history.prices
                :
                [];


            log(
                "History received: " +
                prices.length +
                " ticks."
            );


            if(
                prices.length === 0
            ){

                log(
                    "No historical prices returned."
                );

                return;

            }


            status(
                "HISTORY LOADED - STARTING LIVE STREAM",
                true
            );


            /*
               Now subscribe to live ticks.
               We deliberately wait until
               history has arrived.
            */

            log(
                "Subscribing to live ticks..."
            );


            const symbol =
                document.getElementById(
                    "symbol"
                ).value;


            ws.send(
                JSON.stringify({

                    ticks:
                        symbol,

                    subscribe:
                        1,

                    req_id:
                        2

                })
            );


            return;

        }


        /*
           LIVE TICK
        */

        if(
            data.msg_type ===
            "tick"
        ){

            if(
                !data.tick ||
                data.tick.quote === undefined
            ){

                return;

            }


            const quote =
                data.tick.quote;


            tickCount++;


            document.getElementById(
                "tick"
            ).innerText =
                quote;


            document.getElementById(
                "count"
            ).innerText =
                tickCount;


            status(
                "LIVE - RECEIVING TICKS",
                true
            );


            if(
                tickCount <= 5
            ){

                log(
                    "LIVE TICK " +
                    tickCount +
                    ": " +
                    quote
                );

            }

        }

    };


    /* ================================
       ERROR
    ================================ */

    ws.onerror =
    function(error){

        status(
            "WEBSOCKET ERROR"
        );

        log(
            "WebSocket error occurred."
        );

    };


    /* ================================
       CLOSE
    ================================ */

    ws.onclose =
    function(event){

        status(
            "DISCONNECTED - CODE " +
            event.code
        );


        log(
            "Connection closed."
        );


        log(
            "Close code: " +
            event.code
        );


        if(
            event.reason
        ){

            log(
                "Reason: " +
                event.reason
            );

        }

    };

}

</script>

</body>
</html>
