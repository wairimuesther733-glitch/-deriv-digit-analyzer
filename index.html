<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Deriv Connection Test</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    padding:20px;
    background:#070b16;
    color:white;
    font-family:Arial,sans-serif;
}

.container{
    max-width:700px;
    margin:auto;
}

h1{
    font-size:32px;
    margin-bottom:8px;
}

.subtitle{
    color:#9ca8c4;
    margin-bottom:20px;
}

.card{
    background:#141b30;
    border-radius:16px;
    padding:20px;
    margin-bottom:16px;
}

label{
    display:block;
    margin-top:12px;
    margin-bottom:6px;
    color:#c8d0e3;
}

select,
button{
    width:100%;
    padding:15px;
    border:0;
    border-radius:10px;
    font-size:16px;
}

select{
    background:#f1f1f1;
    color:#111;
}

button{
    margin-top:18px;
    background:#ff3b7f;
    color:white;
    font-weight:bold;
}

button:disabled{
    opacity:.5;
}

.status{
    padding:15px;
    border-radius:10px;
    background:#252f4a;
    font-weight:bold;
}

.good{
    background:#123b2d;
    color:#55e6a5;
}

.bad{
    background:#421d27;
    color:#ff8995;
}

.yellow{
    background:#443914;
    color:#ffd166;
}

.bigTick{
    text-align:center;
    font-size:38px;
    font-weight:bold;
    padding:20px 0;
}

.counter{
    text-align:center;
    color:#9ca8c4;
}

.log{
    background:#050811;
    border-radius:10px;
    padding:14px;
    min-height:220px;
    max-height:350px;
    overflow-y:auto;
    font-family:monospace;
    font-size:13px;
    line-height:1.7;
}

.logLine{
    border-bottom:1px solid #172038;
    padding:3px 0;
}

.success{
    color:#55e6a5;
}

.error{
    color:#ff8995;
}

.info{
    color:#9ca8c4;
}

.warning{
    color:#ffd166;
}

.testBox{
    text-align:center;
    padding:15px;
    background:#0c1325;
    border-radius:10px;
    margin-top:15px;
}

</style>
</head>

<body>

<div class="container">

    <div class="card">

        <h1>🔌 Deriv Connection Test</h1>

        <div class="subtitle">
            Public market-data connection
        </div>

        <label>Market</label>

        <select id="symbol">

            <option value="1HZ10V">
                Volatility 10 Index
            </option>

            <option value="1HZ25V">
                Volatility 25 Index
            </option>

            <option value="1HZ50V">
                Volatility 50 Index
            </option>

            <option value="1HZ75V">
                Volatility 75 Index
            </option>

            <option value="1HZ100V">
                Volatility 100 Index
            </option>

        </select>

        <button
            id="connectButton"
            onclick="connectDeriv()">

            🔌 CONNECT TO DERIV

        </button>

    </div>


    <div class="card">

        <div id="status"
             class="status">

            Status: NOT CONNECTED

        </div>

        <div class="bigTick">

            Last tick:
            <span id="lastTick">—</span>

        </div>

        <div class="counter">

            Live ticks received:
            <strong id="tickCount">0</strong>

        </div>

    </div>


    <div class="card">

        <h2>📡 Connection Log</h2>

        <div id="log"
             class="log">

            <div class="logLine info">
                Ready to connect.
            </div>

        </div>

    </div>


    <div class="card">

        <div class="testBox">

            <strong>
                Current test
            </strong>

            <p id="testMessage"
               class="info">

                Waiting for connection...

            </p>

        </div>

    </div>


    <div class="card">

        <p class="warning">

            ⚠️ This is only a connection and
            market-data test.

            No trades are placed and no account
            credentials are used.

        </p>

    </div>

</div>


<script>

/* ==========================================
   CONNECTION SETTINGS
========================================== */

/*
    Current Deriv public market-data
    WebSocket endpoint.
*/

const DERIV_WS =
    "wss://api.derivws.com/trading/v1/options/ws/public";


let ws = null;

let liveTicks = 0;

let connected = false;


/* ==========================================
   LOGGING
========================================== */

function addLog(
    message,
    type = "info"
){

    const log =
        document.getElementById(
            "log"
        );


    const line =
        document.createElement(
            "div"
        );


    line.className =
        "logLine " +
        type;


    const time =
        new Date()
        .toLocaleTimeString();


    line.textContent =
        "[" +
        time +
        "] " +
        message;


    log.appendChild(
        line
    );


    log.scrollTop =
        log.scrollHeight;

}


/* ==========================================
   STATUS
========================================== */

function setStatus(
    message,
    type = ""
){

    const status =
        document.getElementById(
            "status"
        );


    status.textContent =
        "Status: " +
        message;


    status.className =
        "status " +
        type;

}


/* ==========================================
   CONNECT
========================================== */

function connectDeriv(){

    /* Close previous connection */

    if(ws){

        try{
            ws.close();
        }catch(e){}

        ws = null;

    }


    liveTicks = 0;

    connected = false;


    document.getElementById(
        "tickCount"
    ).textContent = "0";


    document.getElementById(
        "lastTick"
    ).textContent = "—";


    document.getElementById(
        "log"
    ).innerHTML = "";


    const symbol =
        document.getElementById(
            "symbol"
        ).value;


    document.getElementById(
        "connectButton"
    ).disabled = true;


    setStatus(
        "CONNECTING...",
        "yellow"
    );


    document.getElementById(
        "testMessage"
    ).textContent =
        "Opening Deriv public WebSocket...";


    addLog(
        "Opening WebSocket:",
        "info"
    );


    addLog(
        DERIV_WS,
        "info"
    );


    try{

        ws =
            new WebSocket(
                DERIV_WS
            );

    }

    catch(error){

        addLog(
            "Browser could not create WebSocket.",
            "error"
        );


        addLog(
            error.message,
            "error"
        );


        setStatus(
            "CONNECTION FAILED",
            "bad"
        );


        document.getElementById(
            "connectButton"
        ).disabled = false;


        return;

    }


    /* ======================================
       OPEN
    ====================================== */

    ws.onopen =
    function(){

        connected = true;


        setStatus(
            "CONNECTED",
            "good"
        );


        addLog(
            "WebSocket connection established.",
            "success"
        );


        document.getElementById(
            "testMessage"
        ).textContent =
            "Connected. Requesting market data...";


        /*
            First request historical ticks.
        */

        requestHistory(
            symbol
        );

    };


    /* ======================================
       MESSAGE
    ====================================== */

    ws.onmessage =
    function(event){

        let data;


        try{

            data =
                JSON.parse(
                    event.data
                );

        }

        catch(error){

            addLog(
                "Received unreadable server message.",
                "error"
            );

            return;

        }


        /*
            Show server errors.
        */

        if(data.error){

            addLog(
                "Deriv API error: " +
                (
                    data.error.message ||
                    JSON.stringify(
                        data.error
                    )
                ),
                "error"
            );


            setStatus(
                "API ERROR",
                "bad"
            );


            return;

        }


        /*
            Historical data.
        */

        if(
            data.msg_type ===
            "history"
        ){

            handleHistory(
                data,
                symbol
            );


            return;

        }


        /*
            Live tick.
        */

        if(
            data.msg_type ===
            "tick"
        ){

            handleTick(
                data
            );


            return;

        }


        /*
            Other response.
        */

        if(
            data.msg_type
        ){

            addLog(
                "Received: " +
                data.msg_type,
                "info"
            );

        }

    };


    /* ======================================
       ERROR
    ====================================== */

    ws.onerror =
    function(){

        connected = false;


        setStatus(
            "WEBSOCKET ERROR",
            "bad"
        );


        addLog(
            "Browser reported a WebSocket error.",
            "error"
        );


        document.getElementById(
            "testMessage"
        ).textContent =
            "The browser could not maintain the WebSocket connection.";

    };


    /* ======================================
       CLOSE
    ====================================== */

    ws.onclose =
    function(event){

        connected = false;


        setStatus(
            "DISCONNECTED - CODE " +
            event.code,
            "bad"
        );


        addLog(
            "Connection closed.",
            "error"
        );


        addLog(
            "Close code: " +
            event.code,
            "error"
        );


        if(event.reason){

            addLog(
                "Reason: " +
                event.reason,
                "error"
            );

        }


        document.getElementById(
            "connectButton"
        ).disabled = false;


        document.getElementById(
            "testMessage"
        ).textContent =
            "Connection closed. See the log above.";

    };

}


/* ==========================================
   HISTORY
========================================== */

function requestHistory(
    symbol
){

    if(
        !ws ||
        ws.readyState !==
        WebSocket.OPEN
    ){

        addLog(
            "WebSocket is not open.",
            "error"
        );

        return;

    }


    setStatus(
        "CONNECTED - LOADING HISTORY...",
        "yellow"
    );


    addLog(
        "Requesting 250 historical ticks...",
        "info"
    );


    /*
        Deriv market-data request.
    */

    ws.send(

        JSON.stringify({

            ticks_history:
                symbol,

            end:
                "latest",

            count:
                250,

            style:
                "ticks",

            req_id:
                1

        })

    );

}


/* ==========================================
   HISTORY RESPONSE
========================================== */

function handleHistory(
    data,
    symbol
){

    let prices = [];


    if(
        data.history &&
        Array.isArray(
            data.history.prices
        )
    ){

        prices =
            data.history.prices;

    }


    addLog(
        "Historical ticks received: " +
        prices.length,
        "success"
    );


    /*
        Now start the live subscription.
    */

    setStatus(
        "HISTORY LOADED - STARTING LIVE",
        "good"
    );


    document.getElementById(
        "testMessage"
    ).textContent =
        "History loaded. Starting live tick stream...";


    addLog(
        "Subscribing to live ticks...",
        "info"
    );


    ws.send(

        JSON.stringify({

            ticks:
                symbol,

            subscribe:
                1,

            req_id:
                2

        })

    );

}


/* ==========================================
   LIVE TICK
========================================== */

function handleTick(
    data
){

    if(
        !data.tick
    ){

        return;

    }


    const quote =
        data.tick.quote;


    liveTicks++;


    document.getElementById(
        "lastTick"
    ).textContent =
        quote;


    document.getElementById(
        "tickCount"
    ).textContent =
        liveTicks;


    setStatus(
        "LIVE - RECEIVING TICKS",
        "good"
    );


    document.getElementById(
        "testMessage"
    ).textContent =
        "Deriv is connected and sending live ticks.";


    /*
        Only log the first few ticks
        so the log doesn't become huge.
    */

    if(
        liveTicks <= 10
    ){

        addLog(
            "LIVE TICK " +
            liveTicks +
            ": " +
            quote,
            "success"
        );

    }

}


/* ==========================================
   SAFETY: AUTO DISCONNECT NOTICE
========================================== */

window.addEventListener(
    "beforeunload",
    function(){

        if(ws){

            try{
                ws.close();
            }catch(e){}

        }

    }
);

</script>

</body>
</html>
